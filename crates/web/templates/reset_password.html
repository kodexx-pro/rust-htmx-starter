{% extends "base.html" %}
{% block title %}{{ t.reset_title }}{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl justify-center mb-2">{{ t.new_password }}</h1>

      <div id="auth-feedback"></div>

      <form hx-post="/reset-password" hx-target="#auth-feedback" hx-swap="innerHTML" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}" />

        <label class="form-control w-full">
          <div class="label"><span class="label-text">{{ t.new_password_min }}</span></div>
          <input type="password" name="password" minlength="8" placeholder="••••••••" class="input input-bordered w-full" required />
        </label>

        <button type="submit" class="btn btn-primary w-full">{{ t.save_new_password }}</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
