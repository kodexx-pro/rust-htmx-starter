<div id="verification-banner">
  {% if !user.email_verified %}
  <div role="alert" class="alert alert-warning mb-6 shadow-sm">
    <div class="flex-1">
      <h3 class="font-bold">{{ t.confirm_email }}</h3>
      <p class="text-sm">{{ t.verification_sent_to }} <strong>{{ user.email }}</strong>.</p>
    </div>
    <button
      class="btn btn-sm btn-outline"
      hx-post="/resend-verification"
      hx-target="#verification-banner"
      hx-swap="outerHTML">
      {{ t.resend_email }}
    </button>
  </div>
  {% endif %}
</div>
