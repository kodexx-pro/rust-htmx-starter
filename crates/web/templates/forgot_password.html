{% extends "base.html" %}
{% block title %}{{ t.forgot_title }}{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl justify-center mb-2">{{ t.forgot_title }}</h1>
      <p class="text-sm text-base-content/70 text-center mb-4">
        {{ t.forgot_instructions }}
      </p>

      <div id="auth-feedback"></div>

      <form hx-post="/forgot-password" hx-target="#auth-feedback" hx-swap="innerHTML" class="space-y-4">
        <label class="form-control w-full">
          <span class="visually-hidden">{{ t.email }}</span>
          <input type="email" name="email" placeholder="{{ t.email_placeholder }}" class="input input-bordered w-full" required />
        </label>

        <button type="submit" class="btn btn-primary w-full">{{ t.send_recovery_link }}</button>
      </form>

      <p class="text-center text-sm mt-4">
        <a href="/login" class="link link-primary">{{ t.back_to_login }}</a>
      </p>
    </div>
  </div>
</main>
{% endblock %}
